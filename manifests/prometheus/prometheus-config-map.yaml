apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus-microservice'
        static_configs:
          - targets: ['host.docker.internal:8081']
      - job_name: 'prometheus-userservice'
        static_configs:
          - targets: ['host.docker.internal:8080']
      - job_name: 'prometheus-gateway'
        static_configs:
          - targets: ['host.docker.internal:8083']

