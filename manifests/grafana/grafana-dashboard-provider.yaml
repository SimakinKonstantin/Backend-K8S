apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: application
        orgId: 1
        folder: Application
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards
