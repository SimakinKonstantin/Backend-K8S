apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus-microservice'
        static_configs:
          - targets: ['microservice:8081']
      - job_name: 'prometheus-userservice'
        static_configs:
          - targets: ['user_service:8080']
      - job_name: 'prometheus-gateway'
        static_configs:
          - targets: ['gateway:8083']
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']
      - job_name: 'node-exporter'
        static_configs:
          - targets:
              - 'minikube:9100'
              - 'minikube-m02:9100'
              - 'minikube-m03:9100'
      - job_name: 'nginx-ingress-metrics'
        static_configs:
          - targets:
            - '10.244.1.4:9113'
