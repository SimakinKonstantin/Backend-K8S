            }
          ],
          "title": "Количество запросов по кодам ответа",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Суммарное время всех ответов, делённое на количество запросов.",
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "decimals": 3, "min": 0, "unit": "s"},
            "overrides": []
          },
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {
            "legend": {"calcs": ["lastNotNull", "mean"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(userservice_request_sum) / clamp_min(sum(userservice_request_count), 1) or vector(0)",
              "legendFormat": "Среднее время ответа",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Среднее время ответа",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Накопительное количество ошибок, зарегистрированных сервисом пользователей.",
          "fieldConfig": {
            "defaults": {"color": {"fixedColor": "red", "mode": "fixed"}, "decimals": 0, "min": 0, "unit": "short"},
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 9},
          "id": 3,
          "options": {
            "legend": {"calcs": ["lastNotNull", "sum"], "displayMode": "table", "placement": "bottom", "showLegend": true},
