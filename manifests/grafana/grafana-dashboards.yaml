              "legendFormat": "Ошибки",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Количество ошибок сервиса",
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["users-service", "http", "prometheus"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "Users service - метрики сервиса",
      "uid": "users-service",
      "version": 1
    }
