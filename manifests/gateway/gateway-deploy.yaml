apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      pod: gateway-pod
template:
  metadata:
    labels:
      pod: gateway-pod
  spec:
    containers:
    - name: gateway-container
      image: docker.io/konst26/gateway
      env:
        - name: MICROSERVICE_URL
          value: "http://microservice:8081"
        - name: USER_SERVICE_URL
          value: "http://user_service:8080"
      readinessProbe:
        httpGet:
          path: /health
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
        successThreshold: 1